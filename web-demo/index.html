<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>无相山海 · Cocos 引擎接入检查</title>
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <link rel="stylesheet" href="./style.css">
  <link rel="icon" href="favicon.ico">
</head>
<body>
  <!-- Official Cocos template structure; exact-fit lets the engine own resize/input conversion. -->
  <div id="GameDiv" cc_exact_fit_screen="true">
    <div id="Cocos3dGameContainer">
      <canvas id="GameCanvas" width="960" height="640" tabindex="0" aria-label="引擎检查场地：点击后使用 WASD 移动"></canvas>
    </div>
  </div>
  <!-- Polyfills bundle. -->

<script src="src/polyfills.bundle.js" charset="utf-8"> </script>    


<!-- SystemJS support. -->
<script src="src/system.bundle.js" charset="utf-8"> </script>

<!-- Import map -->
<script src="src/import-map.json" type="systemjs-importmap" charset="utf-8"> </script>

<script>
    System.import('./index.js').catch(function(err) { console.error(err); })
</script>
</body>
</html>
